name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  VCPKG_ROOT: /usr/local/share/vcpkg

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug
            os: ubuntu-latest
            compiler: gcc
            build-type: Debug
            preset: dev
          - name: GCC Release
            os: ubuntu-latest
            compiler: gcc
            build-type: Release
            preset: release
          - name: Clang Debug
            os: ubuntu-latest
            compiler: clang
            build-type: Debug
            preset: dev
          - name: Clang Release
            os: ubuntu-latest
            compiler: clang
            build-type: Release
            preset: release

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Update vcpkg
        run: git -C $VCPKG_ROOT fetch origin && git -C $VCPKG_ROOT checkout 3cd21e48a75f67acfef289da52893ce79144aaa1

      - name: Install Clang
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build

      - name: Install Ninja
        if: matrix.compiler != 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          else
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          fi

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }}

      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

  asan:
    name: ASan / UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update vcpkg
        run: git -C $VCPKG_ROOT fetch origin && git -C $VCPKG_ROOT checkout 3cd21e48a75f67acfef289da52893ce79144aaa1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build

      - name: Configure
        run: |
          cmake --preset dev \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build/dev

      - name: Test
        run: ctest --test-dir build/dev --output-on-failure

  clang-tidy:
    name: clang-tidy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Update vcpkg
        run: git -C $VCPKG_ROOT fetch origin && git -C $VCPKG_ROOT checkout 3cd21e48a75f67acfef289da52893ce79144aaa1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang ninja-build

      - name: Configure
        run: |
          cmake --preset dev \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy

      - name: Build (with clang-tidy)
        run: cmake --build build/dev 2>&1 | tee clang-tidy-output.txt

      - name: Upload clang-tidy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-output
          path: clang-tidy-output.txt
